name = "xero-ingest"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Runs every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Keep true until you've checked a few runs in the logs. Nothing is written to Xero or moved in Drive while true.
DRY_RUN = "true"
CLAUDE_MODEL = "claude-opus-5-5"
# Days to wait for the card charge to appear on the bank feed before sending an invoice to Needs review.
PENDING_DAYS = "7"
# Allowed gap between (invoice amount x market rate) and the GBP bank charge, as a fraction. Covers card FX spread and fees.
FX_TOLERANCE = "0.06"
MAX_FILES_PER_RUN = "5"
# Xero tax rates. INPUT2 = 20% VAT on expenses (UK). NONE = no VAT.
VAT_TAX_TYPE = "INPUT2"
NO_VAT_TAX_TYPE = "NONE"
# Google Drive folder IDs (the long ID in the folder's URL).
INGEST_FOLDER_ID = ""
DONE_FOLDER_ID = ""
REVIEW_FOLDER_ID = ""
# Xero bank account the cards are paid from (find it at /admin/bank-accounts).
XERO_BANK_ACCOUNT_ID = ""
XERO_REDIRECT_URI = "https://xero-ingest.YOUR-SUBDOMAIN.workers.dev/xero/callback"

# Secrets (set with `npx wrangler secret put NAME`):
#   ANTHROPIC_API_KEY
#   GOOGLE_SERVICE_ACCOUNT_JSON   (the whole JSON key file)
#   XERO_CLIENT_ID
#   XERO_CLIENT_SECRET
#   ADMIN_TOKEN                   (any long random string; protects the /admin and /xero/connect URLs)
